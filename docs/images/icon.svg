    <rect x="662" y="64" width="15" height="87" fill="url(#aw-icon-shade)"/>
    <g clip-path="url(#aw-icon-faceL)" stroke="#6d685e" stroke-width="2.2" opacity="0.9">
      <line x1="641" y1="80" x2="662" y2="68"/>
      <line x1="641" y1="103" x2="662" y2="91"/>
      <line x1="641" y1="126" x2="662" y2="114"/>
