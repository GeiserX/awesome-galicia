      <line x1="662" y1="91" x2="677" y2="82"/>
      <line x1="662" y1="114" x2="677" y2="105"/>
      <line x1="662" y1="137" x2="677" y2="128"/>
    </g>
    <g fill="#2a2824">
      <rect x="650" y="84" width="3" height="5"/><rect x="650" y="108" width="3" height="5"/><rect x="650" y="131" width="3" height="5"/>
      <rect x="668" y="96" width="2.5" height="5"/><rect x="668" y="120" width="2.5" height="5"/>
    </g>
    <rect x="661" y="64" width="2" height="87" fill="#2a2824" opacity="0.5"/>

    <rect x="639" y="60" width="40" height="4" fill="#a9a395"/>
