<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="256" height="256" role="img" aria-label="Awesome Galicia">
  <!-- The favicon: the same Torre de Hércules as logo.svg, on a plate in the
       banner's darkest sky stop (#0a0c14), with the banner's beam colours
       (#ffd58a to #ffc766, from a-beam) as a glow behind the lantern. Ids carry
       an aw- prefix. -->
  <defs>
    <radialGradient id="aw-icon-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffc766" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffc766" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" rx="72" fill="#0a0c14"/>
  <g transform="translate(-876 41.6) scale(1.6)">
    <circle cx="660" cy="26" r="40" fill="url(#aw-icon-glow)"/>
  </g>
  <g transform="translate(-876 41.6) scale(1.6)">
  <defs>
    <linearGradient id="aw-icon-lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfc8b8"/><stop offset="100%" stop-color="#8f8a7e"/>
    </linearGradient>
    <linearGradient id="aw-icon-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7d786d"/><stop offset="100%" stop-color="#4c4943"/>
    </linearGradient>
    <clipPath id="aw-icon-faceL"><rect x="641" y="64" width="21" height="96"/></clipPath>
    <clipPath id="aw-icon-faceR"><rect x="662" y="64" width="15" height="96"/></clipPath>
  </defs>
  <g transform="translate(660,0) scale(1.1,1) translate(-660,0)">
